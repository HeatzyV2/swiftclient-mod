# Every version number of the mod and its dependencies, for every Minecraft version.
# Updating a dependency = editing this file. Adding a Minecraft version = a new section here plus its
# entry in settings.gradle.kts. Versions come from https://fabricmc.net/develop and Modrinth.
#
# mod.mc_compat  "minecraft" range written in fabric.mod.json
# mod.features   optional features that exist on that version (see featureSources in build.gradle.kts):
#                fog = Fog Customizer (1.21.6+ fog), gpu = custom shaders on the 26.2 render API, glfw = GLFW window (SDL3 from 26.3),
#                skins = 1.21.9+ skin API (Skin Change), submit = entity rendering of 1.21.9+ (capes, wings, knives, item physics...),
#                glyphs = relic / totem effects (vanilla gizmos, 1.21.11+), pets = GeckoLib pets
# deps.<mod>     Modrinth version (empty = not available on that version). GeckoLib uses Modrinth version
#                ids: its version numbers repeat across Minecraft versions. Pets are written for GeckoLib 5.5
#                (26.1+); older GeckoLib builds have another API.

mod.version = "2.7.0"
mod.group = "dev.swiftclient"

deps.fabric_loader = "0.19.5"
