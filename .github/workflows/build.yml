name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Loom 1.18 needs Gradle itself to run on Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew buildAll --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: swiftclient-mod
          path: build/libs/*/*.jar
          if-no-files-found: error

  # Every new mod_version pushed on main becomes a GitHub release with its jar. The launcher downloads
  # the jar of the latest release before each launch, so players get the mod without a launcher update.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: swiftclient-mod
          path: dist

      - name: Publish the release if this version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -nE 's/^mod\.version = "([^"]+)"/\1/p' stonecutter.properties.toml)
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to publish."
            exit 0
          fi
          cd "dist/$VERSION"
          for MC in $(grep -oE 'versions\(([^)]*)\)' ../../settings.gradle.kts | grep -oE '"[^"]+"' | tr -d '"'); do
            test -s "swiftclient-mod-$VERSION+$MC.jar"
          done
          JAR="swiftclient-mod-$VERSION.jar"
          cp "swiftclient-mod-$VERSION+26.2.jar" "$JAR"
          sha256sum *.jar > SHA256SUMS.txt
          test -f "$JAR"
          gh release create "$TAG" "$JAR" --draft --title "Swift Client mod $VERSION" --target "$GITHUB_SHA" \
            --notes "Swift Client mod $VERSION: Fabric builds for Minecraft 1.21.4–1.21.11, 26.1.2, 26.2 and 26.3. The launcher downloads the matching jar on demand. See README.md for the feature matrix."
          gh release upload "$TAG" swiftclient-mod-*+*.jar SHA256SUMS.txt
          gh release edit "$TAG" --draft=false --latest
