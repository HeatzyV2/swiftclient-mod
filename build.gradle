plugins {
    // MC 26.x ships unobfuscated: the non-remapping Loom plugin, no mappings needed.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    // Test libraries only come from Maven Central.
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter {
            includeGroupByRegex 'org\\.junit(\\..*)?'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "maven.modrinth:geckolib:${project.geckolib_version}"
    include "maven.modrinth:geckolib:${project.geckolib_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Bundled performance mods: shipped inside the jar and loaded by runClient too.
    ['sodium', 'lithium', 'immediatelyfast', 'ferrite-core'].each { slug ->
        def v = project.property("${slug.replace('-', '')}_version")
        runtimeOnly "maven.modrinth:${slug}:${v}"
        include "maven.modrinth:${slug}:${v}"
    }
}

test {
    useJUnitPlatform()
    // ./gradlew test --tests '*LangTest*' -PlangDump=<file> : writes the English texts still missing
    if (project.hasProperty('langDump')) {
        systemProperty 'swiftclient.langDump', project.property('langDump')
    }
    // ./gradlew test --tests '*BackendE2ETest*' -Pe2eApi=http://127.0.0.1:8787 -Pe2eRelay=127.0.0.1:18600
    // runs the mod against a real backend started with MOJANG_SESSION_URL=http://127.0.0.1:18555
    if (project.hasProperty('e2eApi')) {
        systemProperty 'swiftclient.e2e.api', project.property('e2eApi')
        systemProperty 'swiftclient.e2e.relay', project.findProperty('e2eRelay') ?: ''
        outputs.upToDateWhen { false }
    }
}

processResources {
    def version = project.version
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

loom {
    runs {
        client {
            // Keep dev runs out of the repo root.
            runDir = 'run'
            // ./gradlew runClient -PauditMixins : applies every mixin at startup (see SwiftClient)
            if (project.hasProperty('auditMixins')) {
                vmArg '-Dswiftclient.auditMixins=true'
            }
        }
    }
}

// Copies the built jar into local launcher instances. Opt-in only: it deletes older
// Swift Client jars and the .fabric cache of each instance, so it must never run as a
// side effect of `build`. Usage:
//   ./gradlew deployLocal                         (~/.swiftclient and %APPDATA%/SwiftClient)
//   ./gradlew deployLocal -PdeployDir=<instances> (any other instances folder)
tasks.register('deployLocal') {
    group = 'distribution'
    description = 'Copies the built jar into every local launcher instance (destructive, opt-in).'
    dependsOn tasks.named('jar')
    doLast {
        def built = tasks.jar.archiveFile.get().asFile
        def roots = project.hasProperty('deployDir')
            ? [file(project.property('deployDir'))]
            : [file("${System.getProperty('user.home')}/.swiftclient/instances"),
               file("${System.getenv('APPDATA')}/SwiftClient/instances")]
        roots.findAll { it != null && it.directory }.each { root ->
            root.eachDir { inst ->
                def mods = [new File(inst, 'minecraft/mods'), new File(inst, 'mods')].find { it.directory }
                if (mods == null) return
                mods.listFiles()?.findAll { it.name ==~ /(?i).*swiftclient.*\.jar/ }?.each { it.delete() }
                def fabric = new File(mods.parentFile, '.fabric')
                if (!fabric.exists()) fabric = new File(inst, '.fabric')
                if (fabric.exists()) fabric.deleteDir()
                java.nio.file.Files.copy(
                    built.toPath(),
                    new File(mods, 'swiftclient-mod.jar').toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                println "deployed ${built.name} -> ${mods}/swiftclient-mod.jar"
            }
        }
    }
}
